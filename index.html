<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeetSalud - Ficha y Consentimiento</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --secondary: #d69e2e;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: var(--primary);
            text-align: center;
        }

        .header-logo {
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        .backup-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .btn-backup {
            background-color: #4a5568;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-backup:hover {
            background-color: #2d3748;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* Selección de Artejos */
        .artejos-container {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            background: #f8fafc;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .artejo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .artejo-item input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* Canvas de Firma */
        .signature-container {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            text-align: center;
            background: #fafafa;
            margin-top: 10px;
        }

        canvas {
            width: 100%;
            height: 150px;
            cursor: crosshair;
        }

        .btn-clear {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: #2b4c7e;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-logo">FeetSalud 👣</div>

    <!-- Gestión de Copia de Seguridad -->
    <div class="backup-controls">
        <button class="btn-backup" onclick="exportarBackup()">📥 Exportar Copia de Seguridad</button>
        <button class="btn-backup" onclick="document.getElementById('importFile').click()">📤 Importar Copia</button>
        <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importarBackup(event)">
    </div>

    <h2>Ficha Clínica y Consentimiento</h2>

    <form id="clinicalForm">
        <!-- Datos del Paciente -->
        <div class="form-group">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" required placeholder="Ej. Ana Pérez">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp:</label>
            <input type="tel" id="telefono" required placeholder="Ej. 300 123 4567">
        </div>

        <!-- Selección de Uñas / Artejos -->
        <div class="form-group">
            <label>Artejos Afectados (Uñas):</label>
            <div class="artejos-container">
                <div class="artejo-item">
                    <span>1 (Gordo)</span>
                    <input type="checkbox" name="artejos" value="Artejo 1">
                </div>
                <div class="artejo-item">
                    <span>2</span>
                    <input type="checkbox" name="artejos" value="Artejo 2">
                </div>
                <div class="artejo-item">
                    <span>3</span>
                    <input type="checkbox" name="artejos" value="Artejo 3">
                </div>
                <div class="artejo-item">
                    <span>4</span>
                    <input type="checkbox" name="artejos" value="Artejo 4">
                </div>
                <div class="artejo-item">
                    <span>5 (Chiquito)</span>
                    <input type="checkbox" name="artejos" value="Artejo 5">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones / Tratamiento:</label>
            <textarea id="observaciones" rows="3" placeholder="Detalles del procedimiento..."></textarea>
        </div>

        <!-- Firma Digital -->
        <div class="form-group">
            <label>Firma de Consentimiento del Paciente:</label>
            <div class="signature-container">
                <canvas id="signaturePad"></canvas>
                <button type="button" class="btn-clear" onclick="limpiarFirma()">Limpiar Firma</button>
            </div>
        </div>

        <button type="submit" class="btn-submit">Guardar Paciente</button>
    </form>
</div>

<script>
    // Configuración del Canvas para la Firma Digital
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let dibujando = false;

    function ajustarCanvas() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
    }
    window.addEventListener('resize', ajustarCanvas);
    ajustarCanvas();

    function obtenerPosicion(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    canvas.addEventListener('mousedown', (e) => { dibujando = true; ctx.beginPath(); const pos = obtenerPosicion(e); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('mousemove', (e) => {
        if (!dibujando) return;
        const pos = obtenerPosicion(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    });
    canvas.addEventListener('mouseup', () => dibujando = false);

    // Soporte Táctil para Celular y Tablet
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); dibujando = true; ctx.beginPath(); const pos = obtenerPosicion(e); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!dibujando) return;
        const pos = obtenerPosicion(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    });
    canvas.addEventListener('touchend', () => dibujando = false);

    function limpiarFirma() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Guardar Información
    document.getElementById('clinicalForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const artejosSeleccionados = Array.from(document.querySelectorAll('input[name="artejos"]:checked')).map(cb => cb.value);
        
        const paciente = {
            id: Date.now(),
            nombre: document.getElementById('nombre').value,
            telefono: document.getElementById('telefono').value,
            artejos: artejosSeleccionados,
            observaciones: document.getElementById('observaciones').value,
            firma: canvas.toDataURL(),
            fecha: new Date().toLocaleDateString()
        };

        let pacientes = JSON.parse(localStorage.getItem('pacientes_feetsalud')) || [];
        pacientes.push(paciente);
        localStorage.setItem('pacientes_feetsalud', JSON.stringify(pacientes));

        alert('¡Paciente guardado con éxito!');
        document.getElementById('clinicalForm').reset();
        limpiarFirma();
    });

    // 📥 Funciones de Copia de Seguridad (Exportar)
    function exportarBackup() {
        const datos = localStorage.getItem('pacientes_feetsalud');
        if (!datos || datos === "[]") {
            alert("No hay información guardada para exportar.");
            return;
        }

        const blob = new Blob([datos], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Copia_Seguridad_FeetSalud_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // 📤 Funciones de Copia de Seguridad (Importar)
    function importarBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const contenido = e.target.result;
                JSON.parse(contenido); // Validar que sea JSON
                localStorage.setItem('pacientes_feetsalud', contenido);
                alert("¡Copia de seguridad restaurada con éxito!");
            } catch (error) {
                alert("El archivo seleccionado no es válido.");
            }
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
