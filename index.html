<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feetsalud - Gestión Podológica</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f0fdf4;
  color:#334155
}
button,input,select,textarea{font:inherit}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column
}

/* =========================
   MENÚ SUPERIOR
========================= */
.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:#134e4a;
  color:white;
  box-shadow:0 2px 10px #0003
}

.topbar-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 18px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.brand-icon{
  font-size:28px
}

.brand h2{
  margin:0;
  font-size:20px
}

.menu-button{
  border:0;
  background:#0d9488;
  color:white;
  border-radius:8px;
  padding:8px 12px;
  font-size:22px;
  cursor:pointer
}

.top-menu{
  display:none;
  background:#0f766e;
  padding:8px
}

.top-menu.open{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px
}

.top-menu button{
  border:0;
  background:transparent;
  color:#d1fae5;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:600;
  text-align:left
}

.top-menu button:hover,
.top-menu button.active{
  background:#0d9488;
  color:white
}

.logout-top{
  background:#dc2626!important;
  color:white!important
}

/* =========================
   CONTENIDO
========================= */
.main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px 18px
}

.title{
  color:#134e4a;
  margin:0 0 20px
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 9px #0000000d;
  margin-bottom:20px
}

.card h3{
  color:#0d9488;
  margin:0 0 15px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.full{
  grid-column:1/-1
}

.input{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:white
}

textarea.input{
  resize:vertical
}

.primary{
  background:#0d9488;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold
}

.primary:hover{
  background:#0f766e
}

.secondary{
  background:#e2e8f0;
  color:#334155;
  border:0;
  padding:10px 13px;
  border-radius:7px;
  cursor:pointer
}

.danger{
  background:#dc2626;
  color:white;
  border:0;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer
}

.searchTop{
  position:sticky;
  top:67px;
  z-index:50
}

.search{
  display:flex;
  gap:10px
}

.item{
  padding:13px;
  border-bottom:1px solid #e2e8f0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

.muted{
  color:#64748b;
  font-size:13px
}

.section{
  border-top:1px solid #e2e8f0;
  margin-top:20px;
  padding-top:20px
}

.badge{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:4px 9px;
  border-radius:12px;
  font-size:11px;
  margin-top:5px;
  font-weight:bold
}

/* =========================
   PODOGRAMA
========================= */
.foot-title{
  font-weight:bold;
  color:#134e4a;
  margin:12px 0 8px
}

.footgrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.toe{
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:12px 5px;
  background:white;
  cursor:pointer
}

.toe.selected{
  background:#fecaca;
  border-color:#ef4444;
  color:#991b1b;
  font-weight:bold
}

/* =========================
   FOTOS
========================= */
.photo-controls{
  border:1px dashed #0d9488;
  padding:15px;
  border-radius:9px;
  background:#f8fffe
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
  margin-top:15px
}

.photo{
  background:#e2e8f0;
  border-radius:9px;
  overflow:hidden
}

.photo img{
  width:100%;
  height:160px;
  object-fit:cover;
  display:block
}

.photo-info{
  background:white;
  padding:8px;
  font-size:12px
}

.photo-tag{
  display:inline-block;
  padding:4px 7px;
  border-radius:10px;
  font-weight:bold;
  font-size:10px;
  margin-bottom:5px
}

.antes{
  background:#fee2e2;
  color:#991b1b
}

.evolucion{
  background:#fef3c7;
  color:#92400e
}

.despues{
  background:#dcfce7;
  color:#166534
}

/* =========================
   CONSENTIMIENTO
========================= */
.consent{
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:18px;
  line-height:1.6
}

.signature{
  width:100%;
  height:190px;
  border:2px solid #94a3b8;
  background:white;
  border-radius:8px;
  touch-action:none;
  display:block
}

/* =========================
   LOGIN
========================= */
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ccfbf1;
  padding:20px
}

.loginCard{
  background:white;
  width:350px;
  padding:35px;
  border-radius:14px;
  box-shadow:0 5px 20px #0002
}

.loginIcon{
  font-size:55px;
  text-align:center
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:700px){
  .top-menu.open{
    grid-template-columns:1fr 1fr
  }

  .main{
    padding:16px 10px
  }

  .grid{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .item{
    flex-direction:column;
    align-items:flex-start
  }

  .footgrid{
    grid-template-columns:repeat(5,1fr)
  }

  .search{
    flex-direction:column
  }

  .searchTop{
    top:61px
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>

/* =====================================================
   BASE DE DATOS LOCAL
===================================================== */

const STORAGE_KEY="FEETSALUD_COMPLETO_V3";

let db;

try{
  db=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
}catch(e){
  db=null;
}

if(!db){
  db={
    patients:[
      {
        id:"1",
        nombre:"María Rodríguez",
        cedula:"1018239401",
        telefono:"573001234567",
        antecedentes:"Diabetes Tipo 2, Hipertensión",
        alergias:"Penicilina",
        medicamentos:"Metformina",
        tipoPie:"Pie normal",
        notas:"Dolor en primer hálux derecho.",
        toes:{
          derecho:{1:true},
          izquierdo:{}
        },
        photos:[],
        procedures:[],
        consents:[],
        visits:[],
        payments:[]
      }
    ],
    appointments:[]
  };
}

let state={
  auth:false,
  tab:"patients",
  selectedId:null,
  search:""
};

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

/* =====================================================
   SEGURIDAD HTML
===================================================== */

function esc(value=""){
  return String(value).replace(/[&<>"']/g,function(m){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m];
  });
}

/* =====================================================
   PROCEDIMIENTOS
===================================================== */

const procedures={

  "Uña encarnada (onicocriptosis)":{
    risk:"dolor, sangrado, inflamación, infección, irritación, retraso en la cicatrización y recurrencia.",
    care:"mantener la zona limpia y seca, realizar las curaciones indicadas, no manipular la zona, utilizar calzado adecuado y consultar si presenta dolor intenso, secreción, sangrado persistente, aumento de inflamación o signos de infección."
  },

  "Onicomicosis":{
    risk:"irritación, sensibilidad, cambios temporales de la uña y persistencia o recurrencia de la infección.",
    care:"mantener los pies limpios y secos, seguir el tratamiento indicado, no compartir elementos personales y asistir a los controles."
  },

  "Pedicure medicado / profilaxis podológica":{
    risk:"sensibilidad, irritación, pequeñas lesiones, sangrado superficial o infección.",
    care:"mantener una adecuada higiene, observar cualquier cambio en la piel o uñas y seguir las recomendaciones entregadas."
  },

  "Callos y clavos":{
    risk:"dolor, irritación, sangrado superficial, infección o recurrencia.",
    care:"no manipular la zona, utilizar calzado apropiado y seguir las recomendaciones de cuidado."
  },

  "Fenolización":{
    risk:"dolor, inflamación, sangrado, infección, alteración de la cicatrización y recurrencia.",
    care:"realizar las curaciones indicadas, mantener la zona protegida, no retirar costras y consultar ante signos de alarma."
  },

  "Verruga plantar":{
    risk:"dolor, irritación, sangrado, infección, cambios en la piel y recurrencia.",
    care:"mantener limpia la zona, evitar manipularla, seguir las indicaciones dadas y asistir a controles."
  }
};

/* =====================================================
   LOGIN
===================================================== */

function login(e){

  e.preventDefault();

  const user=document.getElementById("loginUser").value.trim();
  const pass=document.getElementById("loginPass").value;

  if(user==="admin" && pass==="1234"){

    state.auth=true;
    render();

  }else{

    alert("Usuario o contraseña incorrectos.\n\nUsuario: admin\nContraseña: 1234");

  }
}

function logout(){

  state.auth=false;
  state.selectedId=null;
  render();

}

/* =====================================================
   MENÚ
===================================================== */

function toggleMenu(){

  document.getElementById("topMenu").classList.toggle("open");

}

function go(tab){

  state.tab=tab;

  document.getElementById("topMenu").classList.remove("open");

  render();

}

/* =====================================================
   LAYOUT
===================================================== */

function render(){

  const root=document.getElementById("root");

  if(!state.auth){

    root.innerHTML=`

      <div class="login">

        <div class="loginCard">

          <div class="loginIcon">🦶</div>

          <h2 style="text-align:center;color:#134e4a;margin:8px 0">
            Feetsalud
          </h2>

          <p style="text-align:center;color:#64748b">
            Gestión de Podología
          </p>

          <form onsubmit="login(event)">

            <label>Usuario</label>
            <input
              class="input"
              id="loginUser"
              placeholder="admin"
              required
            >

            <br><br>

            <label>Contraseña</label>

            <input
              class="input"
              id="loginPass"
              type="password"
              placeholder="1234"
              required
            >

            <br><br>

            <button class="primary" style="width:100%">
              Iniciar Sesión
            </button>

          </form>

          <p class="muted" style="text-align:center;margin-top:15px">
            Demo: admin / 1234
          </p>

        </div>

      </div>
    `;

    return;
  }

  root.innerHTML=`

    <div class="app">

      <header class="topbar">

        <div class="topbar-main">

          <div class="brand">
            <span class="brand-icon">🦶</span>
            <h2>Feetsalud</h2>
          </div>

          <button class="menu-button" onclick="toggleMenu()">
            ☰
          </button>

        </div>

        <div class="top-menu" id="topMenu">

          ${menuButton("patients","👤","Pacientes")}
          ${menuButton("appointments","📅","Citas")}
          ${menuButton("payments","💳","Pagos y Caja")}
          ${menuButton("consent","📄","Consentimiento")}
          ${menuButton("podograma","👣","Podograma")}
          ${menuButton("backup","💾","Respaldo")}
          ${menuButton("logout","🚪","Cerrar Sesión")}

        </div>

      </header>

      <main class="main">

        ${content()}

      </main>

    </div>
  `;

  if(state.tab==="consent"){
    setTimeout(initConsent,100);
  }
}

function menuButton(tab,icon,text){

  if(tab==="logout"){

    return `
      <button class="logout-top" onclick="logout()">
        ${icon} ${text}
      </button>
    `;

  }

  return `
    <button
      class="${state.tab===tab?"active":""}"
      onclick="go('${tab}')"
    >
      ${icon} ${text}
    </button>
  `;
}

function content(){

  if(state.tab==="patients")return patientsPage();

  if(state.tab==="appointments")return appointmentsPage();

  if(state.tab==="payments")return paymentsPage();

  if(state.tab==="consent")return consentPage();

  if(state.tab==="podograma")return podogramaPage();

  if(state.tab==="backup")return backupPage();

  return "";
}

/* =====================================================
   PACIENTES
===================================================== */

function patientsPage(){

  const search=state.search.toLowerCase();

  const list=db.patients.filter(p=>
    (
      p.nombre+" "+
      p.cedula+" "+
      p.telefono
    ).toLowerCase().includes(search)
  );

  const patient=db.patients.find(
    p=>p.id===state.selectedId
  );

  return `

    <h2 class="title">
      Historias Clínicas Podológicas
    </h2>

    <div class="card searchTop">

      <h3>🔎 Buscar paciente</h3>

      <div class="search">

        <input
          class="input"
          placeholder="Nombre, cédula o teléfono"
          value="${esc(state.search)}"
          oninput="state.search=this.value;render()"
        >

        <button
          class="secondary"
          onclick="state.search='';render()"
        >
          Limpiar
        </button>

      </div>

      ${
        state.search
        ?
        `<div class="section">

          ${
            list.length
            ?
            list.map(p=>`

              <div class="item">

                <div>
                  <b>${esc(p.nombre)}</b>
                  <br>
                  <span class="muted">
                    C.C. ${esc(p.cedula)}
                    · ${esc(p.telefono)}
                  </span>
                </div>

                <button
                  class="primary"
                  onclick="selectPatient('${p.id}')"
                >
                  Abrir expediente
                </button>

              </div>

            `).join("")
            :
            `<p>No se encontró ningún paciente.</p>`
          }

        </div>`
        :
        ""
      }

    </div>

    ${
      patient
      ?
      patientRecord(patient)
      :
      newPatientForm()
    }

  `;
}

/* =====================================================
   NUEVO PACIENTE
===================================================== */

function newPatientForm(){

  return `

    <div class="card">

      <h3>👤 Registrar Nuevo Paciente</h3>

      <form
        onsubmit="addPatient(event)"
        class="grid"
      >

        <input
          class="input"
          id="pnombre"
          placeholder="Nombre completo"
          required
        >

        <input
          class="input"
          id="pcedula"
          placeholder="Cédula / Documento"
          required
        >

        <input
          class="input"
          id="ptel"
          placeholder="Teléfono WhatsApp"
          required
        >

        <input
          class="input"
          id="pant"
          placeholder="Antecedentes"
        >

        <input
          class="input"
          id="paler"
          placeholder="Alergias conocidas"
        >

        <input
          class="input"
          id="pmed"
          placeholder="Medicamentos que utiliza"
        >

        <input
          class="input"
          id="ptipo"
          placeholder="Tipo de pie"
        >

        <textarea
          class="input full"
          id="pnotas"
          rows="4"
          placeholder="Historia / observaciones podológicas"
        ></textarea>

        <button class="primary full">
          💾 Guardar Paciente
        </button>

      </form>

    </div>

  `;
}

/* =====================================================
   EXPEDIENTE COMPLETO
===================================================== */

function patientRecord(p){

  return `

    <div class="card">

      <div class="patientHead">

        <div>

          <h3>📋 Expediente completo</h3>

          <h2 style="margin:0;color:#134e4a">
            ${esc(p.nombre)}
          </h2>

          <p class="muted">
            C.C. ${esc(p.cedula)}
            · ${esc(p.telefono)}
          </p>

        </div>

        <button
          class="secondary"
          onclick="state.selectedId=null;render()"
        >
          Cerrar ficha
        </button>

      </div>

      <!-- FICHA TÉCNICA -->

      <div class="section">

        <h3>🩺 Ficha técnica podológica</h3>

        <div class="grid">

          <p>
            <b>Antecedentes:</b><br>
            ${esc(p.antecedentes)||"Ninguno"}
          </p>

          <p>
            <b>Alergias:</b><br>
            ${esc(p.alergias)||"Ninguna"}
          </p>

          <p>
            <b>Medicamentos:</b><br>
            ${esc(p.medicamentos)||"Ninguno"}
          </p>

          <p>
            <b>Tipo de pie:</b><br>
            ${esc(p.tipoPie)||"No registrado"}
          </p>

          <p class="full">
            <b>Observaciones:</b><br>
            ${esc(p.notas)||"—"}
          </p>

        </div>

      </div>

      <!-- PODOGRAMA -->

      <div class="section">

        <h3>👣 Podograma · dedos afectados</h3>

        <p class="muted">
          Selecciona los dedos afectados.
        </p>

        <div class="foot-title">
          Pie derecho
        </div>

        <div class="footgrid">
          ${toeButtons(p,"derecho")}
        </div>

        <div class="foot-title">
          Pie izquierdo
        </div>

        <div class="footgrid">
          ${toeButtons(p,"izquierdo")}
        </div>

        <br>

        <textarea
          class="input"
          id="podonota_${p.id}"
          placeholder="Observaciones del podograma..."
          rows="3"
        >${esc(p.podogramaNota||"")}</textarea>

        <br><br>

        <button
          class="primary"
          onclick="savePodograma('${p.id}')"
        >
          💾 Guardar Podograma
        </button>

      </div>

      <!-- FOTOS -->

      <div class="section">

        <h3>📸 Fotografías del proceso</h3>

        <div class="photo-controls">

          <div class="grid">

            <select
              class="input"
              id="photoType_${p.id}"
            >
              <option value="Antes">
                Antes del procedimiento
              </option>

              <option value="Evolución">
                Evolución / Proceso
              </option>

              <option value="Después">
                Después del procedimiento
              </option>
            </select>

            <button
              class="primary"
              onclick="takePhoto('${p.id}')"
            >
              📷 Tomar foto
            </button>

            <label
              class="primary"
              style="text-align:center;cursor:pointer"
            >
              🖼️ Galería

              <input
                type="file"
                accept="image/*"
                multiple
                style="display:none"
                onchange="uploadPhotos('${p.id}',this.files)"
              >

            </label>

          </div>

        </div>

        <div class="photoGrid">

          ${
            p.photos.length
            ?
            p.photos.map((photo,i)=>`

              <div class="photo">

                <img
                  src="${photo.data}"
                  alt="Fotografía podológica"
                >

                <div class="photo-info">

                  <span class="photo-tag ${
                    photo.type==="Antes"
                    ?"antes"
                    :
                    photo.type==="Después"
                    ?"despues"
                    :
                    "evolucion"
                  }">
                    ${esc(photo.type)}
                  </span>

                  <br>

                  ${esc(photo.date)}

                  <br><br>

                  <button
                    class="danger"
                    onclick="deletePhoto('${p.id}',${i})"
                  >
                    Eliminar
                  </button>

                </div>

              </div>

            `).join("")
            :
            `<p class="muted">
              Todavía no hay fotografías de este paciente.
            </p>`
          }

        </div>

      </div>

      <!-- PROCEDIMIENTOS -->

      <div class="section">

        <h3>🩺 Procedimientos realizados</h3>

        <form
          class="grid"
          onsubmit="addProcedure(event,'${p.id}')"
        >

          <select
            class="input"
            id="procedure_${p.id}"
          >

            ${Object.keys(procedures).map(x=>
              `<option>${esc(x)}</option>`
            ).join("")}

          </select>

          <input
            class="input"
            id="procedureDate_${p.id}"
            type="date"
            value="${new Date().toISOString().slice(0,10)}"
          >

          <textarea
            class="input full"
            id="procedureNotes_${p.id}"
            rows="3"
            placeholder="Qué se realizó, evolución y observaciones..."
          ></textarea>

          <button class="primary full">
            💾 Guardar procedimiento
          </button>

        </form>

        ${
          p.procedures.length
          ?
          p.procedures.map(x=>`

            <div class="item">

              <div>

                <b>${esc(x.name)}</b>

                <br>

                <span class="muted">
                  ${esc(x.date)}
                  · ${esc(x.notes)}
                </span>

              </div>

            </div>

          `).join("")
          :
          `<p class="muted">
            No hay procedimientos registrados.
          </p>`
        }

      </div>

      <!-- CONSENTIMIENTOS -->

      <div class="section">

        <h3>📄 Consentimientos firmados</h3>

        ${
          p.consents.length
          ?
          p.consents.map((c,i)=>`

            <div class="item">

              <div>

                <b>${esc(c.procedure)}</b>

                <br>

                <span class="muted">
                  ${esc(c.date)}
                  · Firmado electrónicamente
                </span>

              </div>

              <button
                class="secondary"
                onclick="viewConsent('${p.id}',${i})"
              >
                Ver consentimiento
              </button>

            </div>

          `).join("")
          :
          `<p class="muted">
            No hay consentimientos firmados.
          </p>`
        }

      </div>

      <!-- VISITAS -->

      <div class="section">

        <h3>📅 Visitas y evolución</h3>

function toeButtons(p,foot){

  if(!p.toes){
    p.toes={
      derecho:{},
      izquierdo:{}

  if(!p.toes[foot]){
    p.toes[foot]={};
  }

  return [1,2,3,4,5].map(n=>`

    <button
      type="button"
      class="toe ${p.toes[foot][n]?"selected":""}"
      onclick="toggleToe('${p.id}','${foot}',${n})"
    >
      ${n}º dedo
      ${p.toes[foot][n]?" ✓":""}
    </button>

  `).join("");
}

function toggleToe(id,foot,n){

  const p=db.patients.find(x=>x.id===id);

  if(!p.toes){
    p.toes={
      derecho:{},
      izquierdo:{}
    };
  }

  if(!p.toes[foot]){
    p.toes[foot]={};
  }

  p.toes[foot][n]=!p.toes[foot][n];

  save();
  render();
}

function takePhoto(id){

  const input=document.createElement("input");

  input.type="file";
  input.accept="image/*";
  input.capture="environment";

  input.onchange=()=>{

    if(input.files.length){
      uploadPhotos(id,input.files);
    }

  };

  input.click();
}

function uploadPhotos(id,files){

  const p=db.patients.find(x=>x.id===id);

  if(!p)return;

  const type=
    document.getElementById("photoType_"+id)?.value
    ||"Antes";

  [...files].forEach(file=>{

    const reader=new FileReader();

    reader.onload=function(e){

      p.photos.push({

        data:e.target.result,

        type:type,

        date:new Date().toLocaleString("es-CO"),

        name:file.name

      });

      save();

      render();

    };

    reader.readAsDataURL(file);

  });

}

function deletePhoto(id,index){

  if(!confirm("¿Eliminar esta fotografía?"))return;

  const p=db.patients.find(x=>x.id===id);

  p.photos.splice(index,1);

  save();

  render();

}

/* =====================================================
   FIRMA ELECTRÓNICA
===================================================== */

let drawing=false;

function initConsent(){

  updateConsent();

  const canvas=
    document.getElementById("signatureCanvas");

  if(!canvas)return;

  const ratio=
    Math.max(window.devicePixelRatio||1,1);

  canvas.width=
    canvas.clientWidth*ratio;

  canvas.height=
    canvas.clientHeight*ratio;

  const ctx=canvas.getContext("2d");

  ctx.scale(ratio,ratio);

  ctx.lineWidth=2.2;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  function position(e){

    const rect=
      canvas.getBoundingClientRect();

    return {
      x:e.clientX-rect.left,
      y:e.clientY-rect.top
    };

  }

  canvas.onpointerdown=function(e){

    drawing=true;

    canvas.setPointerCapture(e.pointerId);

    const p=position(e);

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);

  };

  canvas.onpointermove=function(e){

    if(!drawing)return;

    const p=position(e);

    ctx.lineTo(p.x,p.y);
    ctx.stroke();

  };

  canvas.onpointerup=function(){

    drawing=false;

  };

  canvas.onpointercancel=function(){

    drawing=false;

  };

}

function clearSignature(){

  const canvas=
    document.getElementById("signatureCanvas");

  if(!canvas)return;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}

function signatureHasInk(canvas){

  const ctx=canvas.getContext("2d");

  const data=ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
  ).data;

  for(let i=3;i<data.length;i+=4){

    if(data[i]>0)return true;

  }

  return false;

}

function saveConsent(){

  const patientId=
    document.getElementById("consentPatient").value;

  const procedure=
    document.getElementById("consentProcedure").value;

  const accepted=
    document.getElementById("consentAccept").checked;

  const canvas=
    document.getElementById("signatureCanvas");

  if(!accepted){

    alert(
      "El paciente debe aceptar los términos del consentimiento."
    );

    return;

  }

  if(!signatureHasInk(canvas)){

    alert(
      "El paciente debe realizar su firma electrónica."
    );

    return;

  }

  const p=db.patients.find(
    x=>x.id===patientId
  );

  p.consents.push({

    procedure,

    date:
      new Date().toLocaleString("es-CO"),

    signature:
      canvas.toDataURL("image/png")

  });

  save();

  alert(
    "Consentimiento firmado y guardado correctamente en el expediente del paciente."
  );

  state.selectedId=p.id;
  state.tab="patients";

  render();

}

function downloadBackup(){

  const data=
    JSON.stringify(db,null,2);

  const blob=
    new Blob(
      [data],
      {type:"application/json"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;

  a.download=
    "feetsalud_respaldo_"+
    new Date().toISOString().slice(0,10)+
    ".json";

  a.click();

  URL.revokeObjectURL(url);

}

function clearAllData(){

  if(!confirm(
    "¿Seguro que quieres borrar TODOS los datos? Esta acción no se puede deshacer."
  ))return;

  localStorage.removeItem(STORAGE_KEY);

  location.reload();

}
